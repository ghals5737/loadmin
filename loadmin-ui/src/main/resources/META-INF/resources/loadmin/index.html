<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loadmin</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2330; --muted: #6b7484;
    --border: #e3e6eb; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 32px; background: var(--card); border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header .tagline { color: var(--muted); font-size: 13px; }
  main { max-width: 880px; margin: 32px auto; padding: 0 24px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; }
  table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  th, td { text-align: left; padding: 10px 16px; font-size: 14px; }
  th { background: var(--bg); color: var(--muted); font-weight: 600; font-size: 12px;
       text-transform: uppercase; letter-spacing: 0.04em; }
  tr + tr td { border-top: 1px solid var(--border); }
  .method {
    display: inline-block; min-width: 52px; text-align: center; padding: 2px 8px;
    border-radius: 4px; font-size: 12px; font-weight: 700; color: #fff;
  }
  .method-GET { background: #16a34a; }
  .method-POST { background: #2563eb; }
  .method-PUT { background: #d97706; }
  .method-PATCH { background: #7c3aed; }
  .method-DELETE { background: #dc2626; }
  .method-ANY, .method-default { background: #6b7484; }
  .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .handler { color: var(--muted); font-size: 13px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>loadmin</h1>
  <span class="tagline">load test targets discovered from <code>@LoadTest</code></span>
</header>
<main>
  <h2>Endpoints</h2>
  <table>
    <thead>
      <tr><th>Method</th><th>Path</th><th>Handler</th></tr>
    </thead>
    <tbody id="endpoints">
      <tr><td colspan="3" class="empty">Loading…</td></tr>
    </tbody>
  </table>
</main>
<script>
  fetch('api/endpoints')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (endpoints) {
      var tbody = document.getElementById('endpoints');
      tbody.innerHTML = '';
      if (endpoints.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty">' +
          'No endpoints found. Add <code>@LoadTest</code> to a handler method.</td></tr>';
        return;
      }
      endpoints.forEach(function (ep) {
        var tr = document.createElement('tr');

        var methodTd = document.createElement('td');
        var badge = document.createElement('span');
        badge.className = 'method method-' + ep.httpMethod + ' method-default';
        badge.textContent = ep.httpMethod;
        methodTd.appendChild(badge);

        var pathTd = document.createElement('td');
        pathTd.className = 'path';
        pathTd.textContent = ep.path;

        var handlerTd = document.createElement('td');
        handlerTd.className = 'handler';
        handlerTd.textContent = ep.handler;

        tr.append(methodTd, pathTd, handlerTd);
        tbody.appendChild(tr);
      });
    })
    .catch(function (err) {
      document.getElementById('endpoints').innerHTML =
        '<tr><td colspan="3" class="empty">Failed to load endpoints: ' + err.message + '</td></tr>';
    });
</script>
</body>
</html>
