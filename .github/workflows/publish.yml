name: Publish to Maven Central

# Tagging v0.1.0 builds, tests, signs and uploads the release. The Central
# Portal then holds it as VALIDATED until it is released by hand — a published
# version can never be changed or removed.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(./gradlew -q properties --property version | awk '/^version:/ { print $2 }')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi
          echo "releasing $version"

      - name: Build and test
        run: ./gradlew build

      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # The secret may hold the ASCII-armored key, or base64 of either the
          # armored text or the binary export. Normalise it to armored text.
          printf '%s' "$GPG_PRIVATE_KEY" > raw.key
          if grep -q 'BEGIN PGP PRIVATE KEY' raw.key; then
            mv raw.key signing.asc
          else
            tr -d '[:space:]' < raw.key | base64 -d > decoded.key
            if grep -q 'BEGIN PGP PRIVATE KEY' decoded.key; then
              mv decoded.key signing.asc
            else
              gpg --batch --quiet --import decoded.key
              gpg --batch --quiet --pinentry-mode loopback \
                  --passphrase "$GPG_PASSPHRASE" \
                  --armor --export-secret-keys > signing.asc
            fi
          fi

          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(cat signing.asc)"
          rm -f raw.key decoded.key signing.asc

          ./gradlew publishToMavenCentral --no-daemon
